---
services:
  provenance_gateway:
    build: .
    image: swarm_connect:main
    ports:
      # Docker publishes ports via its own iptables chains, which bypass ufw — a
      # published port is reachable from the internet even when the host firewall
      # denies it. Set GATEWAY_BIND=127.0.0.1 on hosts that terminate TLS with a
      # local reverse proxy, so the gateway is not also served in plaintext.
      - "${GATEWAY_BIND:-0.0.0.0}:8899:8000"
    env_file:
      - /opt/swarm_connect.env
    environment:
      # Required. Previously defaulted to one specific node, which silently
      # became wrong once a second host existed and would point at a dead
      # endpoint once that node is retired — the gateway would start, report
      # itself up, and fail every Swarm operation. Failing to start with a clear
      # message is better than running misconfigured.
      - SWARM_BEE_API_URL=${SWARM_BEE_API_URL:?set SWARM_BEE_API_URL (e.g. http://bee:1633 for the bundled node, or your Bee node URL)}
    volumes:
      - /opt/swarm_connect_data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3

  provenance_gateway_dev:
    build: .
    image: swarm_connect:dev
    ports:
      - "${GATEWAY_BIND:-0.0.0.0}:8900:8000"
    env_file:
      - /opt/swarm_connect_dev.env
    environment:
      # Separate from production so the two environments can use different Bee
      # nodes on one host. Required for the same reason as above.
      - SWARM_BEE_API_URL=${SWARM_BEE_API_URL_DEV:?set SWARM_BEE_API_URL_DEV (e.g. http://bee-dev:1633 for the bundled node)}
    volumes:
      - /opt/swarm_connect_dev_data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3

  alloy:
    image: grafana/alloy:latest
    volumes:
      - ./monitoring/alloy/config.alloy:/etc/alloy/config.alloy:ro
    environment:
      - GRAFANA_CLOUD_PROM_USERNAME=${GRAFANA_CLOUD_PROM_USERNAME}
      - GRAFANA_CLOUD_API_TOKEN=${GRAFANA_CLOUD_API_TOKEN}
      # Tags this host's metrics so several hosts running the stack stay
      # distinguishable in Grafana. Empty by default -> no label added, so an
      # existing host's series are unchanged until it is explicitly set.
      - HOST_LABEL=${HOST_LABEL:-}
    command: ["run", "/etc/alloy/config.alloy"]
    restart: unless-stopped
    depends_on:
      - provenance_gateway_dev

  # ------------------------------------------------------------------------- #
  # Optional bundled Bee nodes ("bee" profile)
  #
  # Lets a host run the gateway and its own Bee node as one self-contained stack
  # instead of pointing at an external node. Both services sit behind the `bee`
  # profile, so they are INERT unless the host opts in with COMPOSE_PROFILES=bee
  # — a host that does not set it deploys exactly as before.
  #
  # The Bee API is deliberately NOT published: it has no authentication, so it is
  # reachable only over the compose network (http://bee:1633 / http://bee-dev:1633).
  # Only the p2p ports are exposed, on distinct host ports so the two nodes can
  # coexist. BEE_NAT_ADDR must advertise the matching public host:port or peers
  # cannot dial back — and since Bee 2.7.0 an invalid value fails startup.
  # ------------------------------------------------------------------------- #
  bee:
    image: ethersphere/bee:${BEE_VERSION:-2.8.1}
    profiles: ["bee"]
    environment:
      - BEE_MAINNET=true
      - BEE_API_ADDR=:1633
      # Listen on the same port that is published, so the address advertised
      # via BEE_NAT_ADDR matches the port peers actually reach. A mismatch
      # leaves the node reporting reachability "Private" even when the port is
      # open, because its own reachability probe cannot dial itself back.
      - BEE_P2P_ADDR=:${BEE_P2P_PORT:-1634}
      - BEE_NAT_ADDR=${BEE_NAT_ADDR:-}
      - BEE_SWAP_ENABLE=true          # required to push chunks
      - BEE_FULL_NODE=${BEE_FULL_NODE:-false}
      - BEE_PASSWORD=${BEE_PASSWORD:-}
      - BEE_DATA_DIR=/home/bee/.bee
      - BEE_VERBOSITY=${BEE_VERBOSITY:-3}
    # The RPC endpoint is passed as an explicit flag: Bee reads the equivalent
    # env var as empty (multi-dash key quirk), but the flag works.
    command: start --blockchain-rpc-endpoint=${BEE_RPC_ENDPOINT:-}
    ports:
      - "${BEE_P2P_PORT:-1634}:${BEE_P2P_PORT:-1634}/tcp"
      - "${BEE_P2P_PORT:-1634}:${BEE_P2P_PORT:-1634}/udp"
    volumes:
      - bee-data:/home/bee/.bee
    restart: unless-stopped

  bee-dev:
    image: ethersphere/bee:${BEE_VERSION:-2.8.1}
    profiles: ["bee"]
    environment:
      - BEE_MAINNET=true
      - BEE_API_ADDR=:1633
      - BEE_P2P_ADDR=:${BEE_DEV_P2P_PORT:-1734}
      - BEE_NAT_ADDR=${BEE_DEV_NAT_ADDR:-}
      - BEE_SWAP_ENABLE=true
      - BEE_FULL_NODE=${BEE_DEV_FULL_NODE:-false}
      - BEE_PASSWORD=${BEE_DEV_PASSWORD:-}
      - BEE_DATA_DIR=/home/bee/.bee
      - BEE_VERBOSITY=${BEE_VERBOSITY:-3}
    command: start --blockchain-rpc-endpoint=${BEE_RPC_ENDPOINT:-}
    ports:
      - "${BEE_DEV_P2P_PORT:-1734}:${BEE_DEV_P2P_PORT:-1734}/tcp"
      - "${BEE_DEV_P2P_PORT:-1734}:${BEE_DEV_P2P_PORT:-1734}/udp"
    volumes:
      - bee-dev-data:/home/bee/.bee
    restart: unless-stopped

volumes:
  bee-data:
  bee-dev-data:
