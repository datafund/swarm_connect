name: tests

# Runs the hermetic suite on every pull request, and is called by deploy.yml
# so nothing is deployed unless it passes (#360). Live tests stay skipped:
# they need RUN_LIVE_TESTS and a reachable gateway.
on:
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    name: pytest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # Same minor version as the Docker image's base (Dockerfile FROM) and
          # the lock's --python-version; tests/test_ci_workflow.py checks it.
          python-version: "3.12"
          # The cache holds downloaded wheels only; --require-hashes checks each
          # one against the lock, so it can speed up the install but never
          # change it. Keyed on the lock so a lock bump gets a fresh key.
          cache: pip
          cache-dependency-path: requirements.lock
      - name: install (locked)
        # Test exactly what the image ships (#523): the same command as the
        # Dockerfile. requirements.txt only sets floors, so installing it here
        # would test whatever resolves today, not the pinned set.
        # --no-deps: the lock is complete, and without it pip treats an extra
        # (x402 -> fastapi[standard]) as a new unpinned requirement and refuses
        # the install in --require-hashes mode.
        run: python -m pip install --no-deps --require-hashes -r requirements.lock
      - name: pip check
        # Fails CI if the lock misses a dependency or pins a conflicting one,
        # as the image build would.
        run: python -m pip check
      - name: pytest
        env:
          # Required by Settings; tests never reach it.
          SWARM_BEE_API_URL: http://localhost:1
        run: python -m pytest -q
