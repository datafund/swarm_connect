name: image

# Builds the Docker image on every pull request, from a clean state, and checks
# that it starts and answers GET / (#486).
#
# Why: the image used to be built only by deploy.yml, after a merge, on the
# deploy hosts, which reuse their Docker layer cache. On 2026-10-05 every
# staging deploy failed at `build docker image` because a clean build rejected
# the lock (#483); no pull-request check had built the image at all.
#
# No layer cache, on purpose: --no-cache rebuilds every layer, so a cached pip
# layer cannot hide a lock that no longer installs, and --pull fetches the
# current base image, so a stale one cannot either. A fresh hosted runner has
# no cache anyway; the flags keep it that way if the runner ever changes.
# linux/amd64 is what the deploy hosts run, and ubuntu-latest builds it natively.
#
# Not called by deploy.yml: each deploy host builds the image itself before it
# stops the running gateway, so a broken build there already stops the deploy
# safely. Building it here again would only add minutes to every deploy.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker-build:
    name: docker-build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      IMAGE: swarm_connect:ci
      CONTAINER: swarm_connect_ci
    steps:
      - uses: actions/checkout@v4

      - name: docker build (no cache)
        run: docker build --pull --no-cache --platform linux/amd64 -t "$IMAGE" .

      - name: smoke check (GET / with Bee unreachable)
        # The only required setting is SWARM_BEE_API_URL. It points at a port
        # nothing listens on, and --network none keeps the check hermetic: no
        # Bee, RPC or facilitator is reached. GET / still answers 200 then
        # (status "degraded"), and with a refused port the /health snapshot
        # is built at once, so the first request does not wait for
        # HEALTH_SNAPSHOT_FIRST_WAIT_SECONDS. The probe is the compose
        # healthcheck's own command, run inside the container.
        run: |
          docker run -d --name "$CONTAINER" --network none \
            -e SWARM_BEE_API_URL=http://localhost:1 "$IMAGE"
          for i in $(seq 1 30); do
            if docker exec "$CONTAINER" curl -fsS --max-time 10 -o /dev/null http://localhost:8000/; then
              echo "GET / answered 200, ${SECONDS} s after docker run"
              exit 0
            fi
            # A container that exited will not start answering by waiting.
            if [ "$(docker inspect -f '{{.State.Running}}' "$CONTAINER")" != "true" ]; then
              echo "::error::the container exited before GET / answered"
              break
            fi
            sleep 2
          done
          echo "::error::GET / did not answer 200 (see the container log below)"
          docker logs --tail 200 "$CONTAINER" || true
          exit 1

      - name: x402 configuration check inside the image
        # Runs only once GET / has answered. The same check deploy.yml runs
        # before replacing a gateway (#485), here with the default settings
        # (x402 off): it must exit 0, so an image that cannot even import its
        # x402 configuration code fails the pull request (#617).
        run: docker exec "$CONTAINER" python -m app.x402.check_config

      - name: TLS trust inside the image (offline)
        # httpx2 (#595) does not use certifi. On Linux it builds a verifying
        # context from OpenSSL's default CA file, the OS bundle that Debian's
        # ca-certificates package provides; truststore is used on macOS and
        # Windows only. An image without that bundle would fail every HTTPS
        # call (Base RPC, the price feed) at runtime, so this checks offline,
        # in the running container, that the gateway's transport gets a
        # verifying context with the OS CAs loaded. The live check against
        # real hosts is on staging (#618).
        run: |
          docker exec -i "$CONTAINER" python - <<'PY'
          import os, ssl
          import httpx2, httpcore2
          BUNDLE = "/etc/ssl/certs/ca-certificates.crt"
          paths = ssl.get_default_verify_paths()
          print(f"httpx2 {httpx2.__version__}, httpcore2 {httpcore2.__version__}, {ssl.OPENSSL_VERSION}")
          print(f"OpenSSL default CA file: {paths.openssl_cafile}")
          assert os.path.isfile(BUNDLE), f"{BUNDLE} is missing: is ca-certificates installed?"
          with open(BUNDLE) as f:
              in_bundle = f.read().count("-----BEGIN CERTIFICATE-----")
          assert in_bundle >= 50, f"{BUNDLE} holds only {in_bundle} certificates"
          # The gateway's shared client builds its transport this way (app/services/http_client.py).
          ctx = httpx2.AsyncHTTPTransport()._pool._ssl_context
          assert ctx.verify_mode == ssl.CERT_REQUIRED and ctx.check_hostname, "httpx2's context does not verify"
          loaded = ctx.cert_store_stats()["x509_ca"]
          assert loaded >= 50, f"httpx2's default context loaded {loaded} CA certificates"
          bundle_ctx = ssl.create_default_context(cafile=BUNDLE)
          assert bundle_ctx.verify_mode == ssl.CERT_REQUIRED
          assert bundle_ctx.cert_store_stats()["x509_ca"] >= 50
          print(f"OK: {in_bundle} certificates in {BUNDLE}; httpx2's verifying context has {loaded} CAs loaded")
          PY

      - name: no test packages in the image (offline)
        # The image installs requirements.lock only; pytest and the other
        # test-only packages are in requirements-dev.lock (#430). This fails
        # if any of them can be imported in the built image.
        run: |
          docker exec -i "$CONTAINER" python - <<'TESTPKGS'
          import importlib.util
          TEST_ONLY = ("pytest", "_pytest", "pytest_asyncio", "pluggy", "iniconfig")
          found = [name for name in TEST_ONLY if importlib.util.find_spec(name) is not None]
          assert not found, f"test-only packages are importable in the image: {found}"
          print(f"OK: none of {', '.join(TEST_ONLY)} is importable")
          TESTPKGS

      - name: remove the container
        if: always()
        run: docker rm -f "$CONTAINER" || true
